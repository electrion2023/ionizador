<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitor Cámaras Frío FK</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
    h1 { text-align: center; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; }
    .camara-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
    }
    .camara-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 15px;
    }
    .camara-header { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; }
    .info { margin: 8px 0; }
    .temp { font-size: 1.8em; font-weight: bold; }
    .high { color: red; }
    .normal { color: green; }
    .input-group { margin: 15px 0; }
    label { display: block; margin-bottom: 5px; }
    input[type="number"] { width: 80px; padding: 6px; }
    button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
    canvas { max-height: 200px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Monitor Cámaras Frío FK</h1>
    <div class="camara-grid" id="camaraGrid"></div>
  </div>

  <script>
    // ================= CONFIGURACIÓN FIREBASE =================
    const firebaseConfig = {
      apiKey: "fsItQV1U7FPegMQ0BihgG7Frj2rRcOiP7MZ4b7gE",           // ← TU API KEY
      authDomain: "pagos-58644.firebaseapp.com",                     // ← TU AUTH DOMAIN
      databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com", // ← TU DATABASE URL
      projectId: "pagos-58644",
      storageBucket: "pagos-58644.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };

    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Generar tarjetas para 8 cámaras
    const grid = document.getElementById("camaraGrid");
    for (let id = 1; id <= 8; id++) {
      const card = document.createElement("div");
      card.className = "camara-card";
      card.innerHTML = `
        <div class="camara-header">Cámara ${id}</div>
        <div class="info">Temperatura actual: <span id="temp${id}" class="temp">-- °C</span></div>
        <div class="info">Última actualización: <span id="ts${id}">--</span></div>
        <div class="info">Temp. Máxima permitida: <span id="max${id}">-- °C</span></div>
        <div class="input-group">
          <label>Cambiar Temp. Máxima:</label>
          <input type="number" id="inputMax${id}" step="0.5" placeholder="ej. 8">
          <button onclick="guardarTempMax(${id})">Guardar</button>
        </div>
        <canvas id="chart${id}"></canvas>
      `;
      grid.appendChild(card);

      // Escuchar cambios en tiempo real
      const base = db.ref(`/camarasFK/camara_${id}`);

      // Temp actual y timestamp
      base.child("actual").on("value", snap => {
        const data = snap.val() || {};
        document.getElementById(`temp${id}`).innerText = data.temp !== undefined ? data.temp + " °C" : "--";
        document.getElementById(`temp${id}`).className = "temp " + (data.temp > (data.tempMax || 999) ? "high" : "normal");
        document.getElementById(`ts${id}`).innerText = data.ts ? new Date(data.ts * 1000).toLocaleString("es-AR") : "--";
      });

      // TempMax
      base.child("tempMax").on("value", snap => {
        const max = snap.val();
        document.getElementById(`max${id}`).innerText = max !== null ? max + " °C" : "--";
        document.getElementById(`inputMax${id}`).value = max !== null ? max : "";
      });

      // Historial (gráfico)
      base.child("historial").on("value", snap => {
        const hist = snap.val() || {};
        const labels = Object.keys(hist).sort().map(ts => new Date(Number(ts) * 1000).toLocaleTimeString("es-AR"));
        const temps = Object.keys(hist).sort().map(ts => hist[ts]);

        const ctx = document.getElementById(`chart${id}`).getContext("2d");
        if (window[`chart${id}`]) window[`chart${id}`].destroy();  // destruir gráfico viejo si existe
        window[`chart${id}`] = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: "Temperatura (°C)",
              data: temps,
              borderColor: "#007bff",
              fill: false,
              tension: 0.1
            }]
          },
          options: {
            responsive: true,
            scales: { y: { beginAtZero: false } }
          }
        });
      });
    }

    // Guardar nuevo tempMax
    function guardarTempMax(camaraId) {
      const nuevoMax = document.getElementById(`inputMax${camaraId}`).value;
      if (!nuevoMax || isNaN(nuevoMax)) {
        alert("Ingresa un número válido");
        return;
      }

      const ref = firebase.database().ref(`/camarasFK/camara_${camaraId}/tempMax`);
      ref.set(Number(nuevoMax))
        .then(() => alert("Temp. Máxima guardada para cámara " + camaraId))
        .catch(err => alert("Error: " + err.message));
    }
  </script>
</body>
</html>
