<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitor FK | Panel de Control</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg: #f0f2f5; --primary: #2563eb; --danger: #ef4444; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); padding-top: 80px; }
    
    header {
      background: #1e293b; color: white; padding: 15px 30px;
      position: fixed; top: 0; width: 100%; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
    }

    .btn-config {
      background: var(--primary); color: white; text-decoration: none;
      padding: 10px 20px; border-radius: 8px; font-weight: bold;
    }

    .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
    .camara-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }

    .camara-card { 
      background: white; border-radius: 15px; padding: 20px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid transparent;
      transition: all 0.3s;
    }

    /* Estilo de Alerta */
    .camara-card.alert { 
      border-color: var(--danger); 
      background: #fff5f5;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

    .temp-val { font-size: 3rem; font-weight: 800; text-align: center; margin: 10px 0; color: var(--primary); }
    .temp-val.high { color: var(--danger); }
    
    .limit-info { text-align: center; font-size: 0.9em; color: #64748b; margin-bottom: 10px; }
    .chart-box { height: 180px; }
  </style>
</head>
<body>

  <header>
    <div><i class="fas fa-snowflake"></i> MONITOR FK</div>
    <a href="configuraciones.html" class="btn-config"><i class="fas fa-cog"></i> CONFIGURACIÓN</a>
  </header>

  <div class="container">
    <div class="camara-grid" id="camaraGrid"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "fsItQV1U7FPegMQ0BihgG7Frj2rRcOiP7MZ4b7gE",
      authDomain: "pagos-58644.firebaseapp.com",
      databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com",
      projectId: "pagos-58644"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const charts = {};

    for (let i = 1; i <= 8; i++) {
      const card = document.createElement("div");
      card.className = "camara-card";
      card.id = `card${i}`;
      card.innerHTML = `
        <div style="font-weight:bold; color:#64748b">Cámara 0${i}</div>
        <div id="temp${i}" class="temp-val">--°C</div>
        <div class="limit-info">Límite: <span id="limit${i}">--</span>°C</div>
        <div class="chart-box"><canvas id="chart${i}"></canvas></div>
      `;
      document.getElementById("camaraGrid").appendChild(card);
      
      // Escuchar datos de la cámara
      db.ref(`/camarasFK/camara_${i}`).on("value", snap => {
        const data = snap.val() || {};
        const actual = data.actual?.temp || 0;
        const max = data.tempMax || 99;

        // Actualizar UI
        const tempEl = document.getElementById(`temp${i}`);
        const cardEl = document.getElementById(`card${i}`);
        tempEl.innerText = actual + "°C";
        document.getElementById(`limit${i}`).innerText = max;

        // Lógica de Alerta
        if (actual > max) {
          cardEl.classList.add("alert");
          tempEl.classList.add("high");
        } else {
          cardEl.classList.remove("alert");
          tempEl.classList.remove("high");
        }

        if (data.historial) updateChart(i, data.historial);
      });
    }

    function updateChart(id, data) {
      const ctx = document.getElementById(`chart${id}`).getContext('2d');
      const keys = Object.keys(data).sort();
      const labels = keys.map(k => new Date(parseInt(k) * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
      const values = keys.map(k => data[k]);

      if (charts[id]) charts[id].destroy();
      charts[id] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{ data: values, borderColor: '#2563eb', tension: 0.4, fill: true, backgroundColor: 'rgba(37, 99, 235, 0.1)' }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }
  </script>
</body>
</html>
