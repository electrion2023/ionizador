<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Configuración de Nodos FK</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 40px; }
    .header-box { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
    .btn-back { color: #94a3b8; text-decoration: none; font-size: 1.2em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .node-card { background: #1e293b; padding: 25px; border-radius: 15px; border: 1px solid #334155; }
    .node-card h3 { margin-top: 0; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    label { display: block; margin-top: 15px; font-size: 0.8em; color: #94a3b8; }
    input { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #0ea5e9; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="header-box">
    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver</a>
    <h1>Gestión de WiFi Nodos</h1>
  </div>

  <div class="grid" id="nodesContainer"></div>

  <script>
    const firebaseConfig = {
      apiKey: "fsItQV1U7FPegMQ0BihgG7Frj2rRcOiP7MZ4b7gE",
      authDomain: "pagos-58644.firebaseapp.com",
      databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com",
      projectId: "pagos-58644"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Generar los 4 paneles para los nodos
    const container = document.getElementById("nodesContainer");
    for (let n = 1; n <= 4; n++) {
      const card = document.createElement("div");
      card.className = "node-card";
      card.innerHTML = `
        <h3><i class="fas fa-microchip"></i> NODO 0${n}</h3>
        <label>SSID de la Red</label>
        <input type="text" id="ssid${n}" placeholder="Cargando...">
        <label>Contraseña WiFi</label>
        <input type="text" id="pass${n}" placeholder="Cargando...">
        <button onclick="saveNode(${n})"><i class="fas fa-save"></i> Guardar Configuración</button>
      `;
      container.appendChild(card);

      // Cargar datos actuales
      db.ref(`camarasFK/nodos/nodo_${n}/wifi`).on("value", snap => {
        const data = snap.val();
        if(data) {
          document.getElementById(`ssid${n}`).value = data.ssid || "";
          document.getElementById(`pass${n}`).value = data.pass || "";
        }
      });
    }

    function saveNode(id) {
      const s = document.getElementById(`ssid${id}`).value;
      const p = document.getElementById(`pass${id}`).value;
      
      db.ref(`camarasFK/nodos/nodo_${id}/wifi`).set({
        ssid: s,
        pass: p
      }).then(() => alert("¡Nodo " + id + " actualizado! El ESP8266 deberá reiniciarse para tomar los cambios."));
    }
  </script>
</body>
</html>
