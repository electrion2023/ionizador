<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Configuraciones FK</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; padding: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    h3 { color: #38bdf8; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    label { display: block; margin-top: 10px; color: #94a3b8; font-size: 0.8em; }
    input { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
    .btn { width: 100%; margin-top: 15px; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-wifi { background: #38bdf8; color: #000; }
    .btn-temp { background: #f59e0b; color: #000; }
    .back { text-decoration: none; color: #38bdf8; margin-bottom: 20px; display: inline-block; }
  </style>
</head>
<body>

  <a href="vercamaras.html" class="back"><i class="fas fa-arrow-left"></i> Volver al Monitor</a>
  <h1>Configuración de Sistema</h1>

  <div class="grid">
    <script>
      for(let n=1; n<=4; n++) {
        document.write(`
          <div class="card">
            <h3>NODO 0${n} (WiFi)</h3>
            <label>SSID</label><input type="text" id="ssid${n}">
            <label>PASSWORD</label><input type="text" id="pass${n}">
            <button class="btn btn-wifi" onclick="saveWifi(${n})">Actualizar WiFi Nodo ${n}</button>
          </div>
        `);
      }
    </script>

    <script>
      for(let c=1; c<=6; c++) {
        document.write(`
          <div class="card">
            <h3>CÁMARA 0${c} (Alertas)</h3>
            <label>Temperatura Máxima (°C)</label>
            <input type="number" id="max${c}" step="0.1">
            <button class="btn btn-temp" onclick="saveTemp(${c})">Fijar Límite Cámara ${c}</button>
          </div>
        `);
      }
    </script>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "fsItQV1U7FPegMQ0BihgG7Frj2rRcOiP7MZ4b7gE",
      authDomain: "pagos-58644.firebaseapp.com",
      databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com",
      projectId: "pagos-58644"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Cargar datos WiFi
    for(let n=1; n<=4; n++) {
      db.ref(`camarasFK/nodos/nodo_${n}/wifi`).on('value', s => {
        if(s.val()){
          document.getElementById(`ssid${n}`).value = s.val().ssid || "";
          document.getElementById(`pass${n}`).value = s.val().pass || "";
        }
      });
    }

    // Cargar límites de Temperatura
    for(let c=1; c<=6; c++) {
      db.ref(`camarasFK/camara_${c}/tempMax`).on('value', s => {
        document.getElementById(`max${c}`).value = s.val() || "";
      });
    }

    function saveWifi(id) {
      const ssid = document.getElementById(`ssid${id}`).value;
      const pass = document.getElementById(`pass${id}`).value;
      db.ref(`camarasFK/nodos/nodo_${id}/wifi`).set({ ssid, pass })
        .then(() => alert("WiFi Actualizado"));
    }

    function saveTemp(id) {
      const t = document.getElementById(`max${id}`).value;
      db.ref(`camarasFK/camara_${id}/tempMax`).set(Number(t))
        .then(() => alert("Temperatura Máxima Actualizada"));
    }
  </script>
</body>
</html>
