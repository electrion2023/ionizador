<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTRION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }
        
        header {
            background: #4a6fa5;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }
        
        .logo {
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .products {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
            gap: 25px;
            justify-content: center;
        }
        
        .product-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            width: 220px;
            text-align: center;
            padding: 20px 15px;
            transition: all 0.25s ease;
        }
        
        .product-card:hover {
            border-color: #4a6fa5;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(74, 111, 165, 0.15);
        }
        
        .product-img {
            width: 100%;
            height: 140px;
            background: #e9ecef;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .product-title {
            font-weight: 600;
            color: #343a40;
            font-size: 1.1rem;
        }
        
        .contact-section {
            background: #f1f3f5;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }
        
        .contact-title {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        
        .contact-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 25px;
        }
        
        .contact-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4a6fa5;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .contact-link:hover {
            text-decoration: underline;
        }
        
        .website-btn {
            display: inline-block;
            background: #4a6fa5;
            color: white;
            padding: 10px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .website-btn:hover {
            background: #3a5a8c;
        }
        
        @media (max-width: 600px) {
            .products {
                flex-direction: column;
                align-items: center;
            }
            
            .product-card {
                width: 90%;
            }
            
            .contact-links {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">ELECTRION</div>
        </header>
        
        <div class="products">
            <div class="product-card">
                <div class="product-img">Foto: Juego 10's</div>
                <div class="product-title">Juego 10's</div>
            </div>
            
            <div class="product-card">
                <div class="product-img">Foto: Ionizadores</div>
                <div class="product-title">Ionizadores</div>
            </div>
        </div>
        
        <div class="contact-section">
            <div class="contact-title">¡Contáctanos!</div>
            <div class="contact-links">
                <a href="https://wa.me/542665007541" class="contact-link">📱 WhatsApp: 2665-007541</a>
                <a href="tel:+542664709447" class="contact-link">📞 Tel: 2664-709447</a>
                <a href="https://instagram.com/ionizador.electrion" target="_blank" class="contact-link">📸 Instagram: ionizador.electrion</a>
            </div>
            <a href="https://electrion.com.ar" target="_blank" class="website-btn">Visitar sitio web</a>
        </div>
    </div>
</body>
</html>
