<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Precios - Lavado de Bidones</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ff6b35;
            font-size: 2em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .form-group {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border: 1px solid #333;
        }

        .form-group label {
            flex: 1;
            font-size: 1.1em;
            color: #fff;
        }

        .form-group input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff6b35;
        }

        .form-group .precio-display {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2em;
            min-width: 80px;
            text-align: right;
        }

        .btn-guardar {
            width: 100%;
            padding: 18px;
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .btn-guardar:hover {
            background: #ff8555;
        }

        .btn-guardar:active {
            transform: scale(0.98);
        }

        .btn-guardar:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .status.success {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid #00ff88;
            display: block;
        }

        .status.error {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border: 1px solid #ff4444;
            display: block;
        }

        .status.loading {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 1px solid #00d4ff;
            display: block;
        }

        .qr-preview {
            margin-top: 10px;
            text-align: center;
        }

        .qr-preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            border: 2px solid #444;
        }

        .section-title {
            color: #888;
            font-size: 0.85em;
            text-transform: uppercase;
            margin: 25px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid #333;
        }

        @media (max-width: 600px) {
            .form-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .form-group .precio-display {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Administrar Precios</h1>
        <p class="subtitle">Modifique los precios de los bidones</p>

        <div class="section-title">Precios</div>

        <div class="form-group">
            <label>Bidón 5L</label>
            <span class="precio-display" id="display-6">$ --</span>
            <input type="number" id="precio-5" placeholder="Nuevo precio">
        </div>

        <div class="form-group">
            <label>Bidón 10L</label>
            <span class="precio-display" id="display-12">$ --</span>
            <input type="number" id="precio-10" placeholder="Nuevo precio">
        </div>

        <div class="form-group">
            <label>Bidón 20L</label>
            <span class="precio-display" id="display-20">$ --</span>
            <input type="number" id="precio-20" placeholder="Nuevo precio">
        </div>

        <div class="section-title">Configuración</div>

        <div class="form-group">
            <label>Token MP</label>
            <span class="precio-display" id="display-token" style="font-size:0.8em; max-width:150px; overflow:hidden; text-overflow:ellipsis;">--</span>
            <input type="text" id="token-mp" placeholder="APP_USR-...">
        </div>

        <div class="form-group">
            <label>URL del QR</label>
            <input type="text" id="qr-url" placeholder="https://..." style="flex:2;">
        </div>

        <div class="qr-preview" id="qr-preview-container" style="display:none;">
            <img id="qr-preview" src="" alt="Vista previa QR">
        </div>

        <button class="btn-guardar" id="btn-guardar">Guardar Cambios</button>

        <div id="status" class="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "fsItQV1U7FPegMQ0BihgG7Frj2rRcOiP7MZ4b7gE",
            authDomain: "pagos-58644.firebaseapp.com",
            databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com/",
            projectId: "pagos-58644",
            storageBucket: "pagos-58644.appspot.com",
            messagingSenderId: "123",
            appId: "1:123:web:abc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ruta = 'nuevaVersion/prueba2/config/';

        // ============================================
        // LEER VALORES ACTUALES DESDE FIREBASE
        // ============================================
        onValue(ref(db, ruta + 'precios/5'), (snapshot) => {
            const val = snapshot.val() || 0;
            document.getElementById('display-5').innerText = '$ ' + val;
            document.getElementById('precio-5').placeholder = 'Actual: $' + val;
        });

        onValue(ref(db, ruta + 'precios/10'), (snapshot) => {
            const val = snapshot.val() || 0;
            document.getElementById('display-10').innerText = '$ ' + val;
            document.getElementById('precio-10').placeholder = 'Actual: $' + val;
        });

        onValue(ref(db, ruta + 'precios/20'), (snapshot) => {
            const val = snapshot.val() || 0;
            document.getElementById('display-20').innerText = '$ ' + val;
            document.getElementById('precio-20').placeholder = 'Actual: $' + val;
        });

        onValue(ref(db, ruta + 'mpToken'), (snapshot) => {
            const val = snapshot.val() || '';
            const display = document.getElementById('display-token');
            display.innerText = val ? val.substring(0, 15) + '...' : '--';
            document.getElementById('token-mp').placeholder = val ? 'Actual: ' + val.substring(0, 20) + '...' : 'APP_USR-...';
        });

        onValue(ref(db, ruta + 'qrUrl'), (snapshot) => {
            const val = snapshot.val() || '';
            document.getElementById('qr-url').placeholder = val ? 'Actual: ' + val.substring(0, 30) + '...' : 'https://...';
            
            if (val) {
                document.getElementById('qr-preview').src = val;
                document.getElementById('qr-preview-container').style.display = 'block';
            }
        });

        // ============================================
        // VISTA PREVIA DEL QR
        // ============================================
        document.getElementById('qr-url').addEventListener('input', (e) => {
            const url = e.target.value;
            if (url && url.startsWith('http')) {
                document.getElementById('qr-preview').src = url;
                document.getElementById('qr-preview-container').style.display = 'block';
            } else {
                document.getElementById('qr-preview-container').style.display = 'none';
            }
        });

        // ============================================
        // GUARDAR CAMBIOS
        // ============================================
        document.getElementById('btn-guardar').addEventListener('click', async () => {
            const btn = document.getElementById('btn-guardar');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.innerText = 'Guardando...';
            status.className = 'status loading';
            status.innerText = 'Guardando cambios en Firebase...';
            status.style.display = 'block';

            try {
                const updates = {};
                
                // Solo actualizar los campos que tienen valor
                const precio5 = document.getElementById('precio-5').value;
                const precio10 = document.getElementById('precio-10').value;
                const precio20 = document.getElementById('precio-20').value;
                const token = document.getElementById('token-mp').value;
                const qrUrl = document.getElementById('qr-url').value;

                if (precio5) updates['precios/5'] = parseInt(precio5);
                if (precio10) updates['precios/10'] = parseInt(precio10);
                if (precio20) updates['precios/20'] = parseInt(precio20);
                if (token) updates['mpToken'] = token;
                if (qrUrl) updates['qrUrl'] = qrUrl;

                if (Object.keys(updates).length === 0) {
                    throw new Error('No hay cambios para guardar');
                }

                await update(ref(db, ruta), updates);

                status.className = 'status success';
                status.innerText = '✅ Cambios guardados exitosamente';
                
                // Limpiar inputs
                document.getElementById('precio-5').value = '';
                document.getElementById('precio-10').value = '';
                document.getElementById('precio-20').value = '';
                document.getElementById('token-mp').value = '';
                document.getElementById('qr-url').value = '';
                document.getElementById('qr-preview-container').style.display = 'none';

                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);

            } catch (error) {
                status.className = 'status error';
                status.innerText = '❌ Error: ' + error.message;
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Guardar Cambios';
            }
        });
    </script>
</body>
</html>
