<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Vending PRO MAX</title>

<style>

body{
font-family:Arial;
background:#f2f6fb;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#2c3e50;
}

.panel{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.estado{
margin-top:20px;
padding:15px;
background:#eef4ff;
border-radius:8px;
}

ul{
list-style:none;
padding:0;
max-height:200px;
overflow:auto;
}

li{
padding:6px;
border-bottom:1px solid #ddd;
}

.contadores{
display:flex;
justify-content:space-between;
text-align:center;
}

.card{
flex:1;
margin:5px;
padding:15px;
border-radius:8px;
background:#0077ff;
color:white;
font-size:18px;
}

canvas{
margin-top:15px;
background:white;
border-radius:10px;
}

.total{
font-size:22px;
text-align:center;
margin-top:10px;
color:#27ae60;
font-weight:bold;
}

</style>
</head>

<body>

<h1>Dashboard Vending PRO MAX</h1>

<div class="panel">

<div class="estado">
<h3>Ventas</h3>
<div class="contadores">
<div class="card">20L<br><span id="c20">0</span></div>
<div class="card">12L<br><span id="c12">0</span></div>
<div class="card">8L<br><span id="c8">0</span></div>
</div>
<div class="total">💰 Total: $<span id="total">$0</span></div>
</div>

<div class="estado">
<h3>Historial</h3>
<ul id="historialLista"></ul>
</div>

<div class="estado">
<h3>Gráfico por tipo</h3>
<canvas id="grafico" width="300" height="200"></canvas>
</div>

<div class="estado">
<h3>Ventas por día</h3>
<canvas id="graficoDias" width="300" height="200"></canvas>
</div>

<div class="estado">
<h3>Ventas por hora</h3>
<canvas id="graficoHoras" width="300" height="200"></canvas>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
apiKey: "fsItQV1U7FPegMQ0BihgG7Frj2rRcOiP7MZ4b7gE",
authDomain: "pagos-58644.firebaseapp.com",
databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com",
projectId: "pagos-58644"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function limpiarValor(v){
if(!v) return "";
return v.toString().replace(/"/g,"").trim().toLowerCase();
}

function traducir(v){
if(v=="b20") return "20L";
if(v=="b12") return "12L";
if(v=="b8") return "8L";
return v;
}

// 💰 precios (ajustalos a los tuyos reales)
const precios = {
b20: 1000,
b12: 700,
b8: 500
};

db.ref("dispositivo/estado/historial").on("value", snap => {

let data = snap.val();

let lista = document.getElementById("historialLista");
lista.innerHTML = "";

let c20=0,c12=0,c8=0;
let total=0;

let ventasDia={};
let ventasHora={};

if(data){

let entradas = Object.entries(data).reverse();

entradas.slice(0,100).forEach(([fecha, valor])=>{

let limpio = limpiarValor(valor);

// historial
let li = document.createElement("li");
li.innerText = fecha+" → "+traducir(limpio);
lista.appendChild(li);

// contadores
if(limpio=="b20"){c20++; total+=precios.b20;}
if(limpio=="b12"){c12++; total+=precios.b12;}
if(limpio=="b8"){c8++; total+=precios.b8;}

// 📅 DIA
let partes = fecha.split(" ");
let dia = partes[0];
if(!ventasDia[dia]) ventasDia[dia]={b20:0,b12:0,b8:0};

if(limpio=="b20") ventasDia[dia].b20++;
if(limpio=="b12") ventasDia[dia].b12++;
if(limpio=="b8") ventasDia[dia].b8++;

// ⏱️ HORA
let hora = partes[1] ? partes[1].split("_")[0] : "00";

if(!ventasHora[hora]) ventasHora[hora]=0;
ventasHora[hora]++;

});

// UI
document.getElementById("c20").innerText=c20;
document.getElementById("c12").innerText=c12;
document.getElementById("c8").innerText=c8;
document.getElementById("total").innerText=total;

// gráficos
dibujarGrafico(c20,c12,c8);
dibujarGraficoDias(ventasDia);
dibujarGraficoHoras(ventasHora);

}

});

// 📊 GRAFICO SIMPLE
function dibujarGrafico(v20,v12,v8){
let c=document.getElementById("grafico");
let ctx=c.getContext("2d");
ctx.clearRect(0,0,300,200);

let max=Math.max(v20,v12,v8,1);
let esc=150/max;

ctx.fillRect(30,180-v20*esc,40,v20*esc);
ctx.fillRect(120,180-v12*esc,40,v12*esc);
ctx.fillRect(210,180-v8*esc,40,v8*esc);

ctx.fillText("20L",35,195);
ctx.fillText("12L",125,195);
ctx.fillText("8L",215,195);
}

// 📅 POR DIA (PRO)
function dibujarGraficoDias(data){
let c=document.getElementById("graficoDias");
let ctx=c.getContext("2d");
ctx.clearRect(0,0,300,200);

let dias=Object.keys(data);
let max=1;

dias.forEach(d=>{
let t=data[d].b20+data[d].b12+data[d].b8;
if(t>max) max=t;
});

dias.forEach((d,i)=>{
let total=data[d].b20+data[d].b12+data[d].b8;
let h=(total/max)*150;
let x=20+i*60;

ctx.fillRect(x,180-h,40,h);
ctx.fillText(d,x,195);
ctx.fillText(total,x,170-h);
});

}

// ⏱️ POR HORA
function dibujarGraficoHoras(data){
let c=document.getElementById("graficoHoras");
let ctx=c.getContext("2d");
ctx.clearRect(0,0,300,200);

let horas=Object.keys(data);
let vals=Object.values(data);
let max=Math.max(...vals,1);

horas.forEach((h,i)=>{
let v=data[h];
let altura=(v/max)*150;
let x=10+i*12;

ctx.fillRect(x,180-altura,8,altura);
});

}

</script>

</body>
</html>
