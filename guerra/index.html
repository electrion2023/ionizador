<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Vending Agua PRO</title>

<style>
.nav{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:15px;
}

.nav a{
padding:10px 15px;
background:#0077ff;
color:white;
border-radius:8px;
text-decoration:none;
}
body{
font-family:Arial;
background:#f2f6fb;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#2c3e50;
}

.panel{
max-width:750px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.item{
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-bottom:5px;
}

input{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
padding:10px 15px;
margin-top:8px;
margin-right:5px;
border:none;
border-radius:6px;
cursor:pointer;
background:#0077ff;
color:white;
}

button:hover{
background:#005fd1;
}

.simular{
background:#00a86b;
}

.simular:hover{
background:#008e5a;
}

.rapido button{
background:#34495e;
margin-bottom:5px;
width:100%;
}

.estado{
margin-top:20px;
padding:15px;
background:#eef4ff;
border-radius:8px;
}

</style>

</head>

<body>

<h1>Panel Vending Agua</h1>

<div class="panel">
<div class="nav">
<a href="index.html">Panel</a>
<a href="ventas.html">Ventas</a>
</div>
<!-- PRECIOS -->

<div class="item">
<label>Precio Mayor (20L)</label>
<input id="preciomayor">
<button onclick="guardarPrecioMayor()">Guardar</button>
</div>

<div class="item">
<label>Precio Menor (10L)</label>
<input id="preciomenor">
<button onclick="guardarPrecioMenor()">Guardar</button>
</div>

<div class="item">
<label>Precio Bidón 8L</label>
<input id="preciobidon8">
<button onclick="guardarPrecioBidon()">Guardar</button>
</div>

<div class="item">
<label>QR</label>
<input id="qr">
<button onclick="guardarQR()">Guardar</button>
</div>

<div class="item">
<label>Ubicación</label>
<input id="ubicacion">
<button onclick="guardarUbicacion()">Guardar</button>
</div>


<!-- SIMULACION MANUAL -->

<div class="item">
<label>Simulación manual</label>
<input id="montoSimulado" placeholder="Ingrese monto">
<button class="simular" onclick="simularPago()">Simular pago</button>
</div>


<!-- BOTONES RAPIDOS -->

<div class="item rapido">

<label>Simulación rápida (cliente)</label>

<button onclick="comprar('menor')">
10L - $<span id="btnMenor">...</span>
</button>

<button onclick="comprar('mayor')">
20L - $<span id="btnMayor">...</span>
</button>

<button onclick="comprar('bidon8')">
8L - $<span id="btnBidon8">...</span>
</button>

</div>


<!-- COMANDOS -->

<div class="item">
<label>Comandos</label>
<button onclick="enviarPaso('ir')">ir</button>
<button onclick="enviarPaso('h')">h</button>
<button onclick="enviarPaso('h1')">h1</button>
<button onclick="enviarPaso('ll')">ll</button>
<button onclick="enviarPaso('ok')">ok</button>
</div>


<!-- ESTADO -->

<div class="estado">

<h3>Estado en tiempo real</h3>

Precio Mayor: <span id="verPreciomayor">...</span><br>
Precio Menor: <span id="verPreciomenor">...</span><br>
Precio Bidón 8L: <span id="verPreciobidon8">...</span><br>
QR: <span id="verQR">...</span><br>
Ubicación: <span id="verUbicacion">...</span>

</div>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
apiKey: "fsItQV1U7FPegMQ0BihgG7Frj2rRcOiP7MZ4b7gE",
authDomain: "pagos-58644.firebaseapp.com",
databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com",
projectId: "pagos-58644"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// GUARDAR PRECIOS

function guardarPrecioMayor(){
db.ref("dispositivo/preciomayor").set(document.getElementById("preciomayor").value);
}

function guardarPrecioMenor(){
db.ref("dispositivo/preciomenor").set(document.getElementById("preciomenor").value);
}

function guardarPrecioBidon(){
db.ref("dispositivo/preciobidon8").set(document.getElementById("preciobidon8").value);
}


// QR Y UBICACION

function guardarQR(){
db.ref("dispositivo/estado/qr").set(document.getElementById("qr").value);
}

function guardarUbicacion(){
db.ref("ubicacion").set(document.getElementById("ubicacion").value);
}


// SIMULACION MANUAL

function simularPago(){

let monto = document.getElementById("montoSimulado").value;

if(monto == ""){
alert("Ingrese un monto");
return;
}

db.ref("dispositivo/estado/autorizado").set("true");
db.ref("dispositivo/estado/monto").set(monto);

alert("Pago simulado $" + monto);

}


// BOTONES RAPIDOS

function comprar(tipo){

let ruta = "";

if(tipo == "menor") ruta = "dispositivo/preciomenor";
if(tipo == "mayor") ruta = "dispositivo/preciomayor";
if(tipo == "bidon8") ruta = "dispositivo/preciobidon8";

db.ref(ruta).once("value").then(snap => {

let monto = snap.val();

if(monto == null){
alert("Precio no definido");
return;
}

db.ref("dispositivo/estado/autorizado").set("true");
db.ref("dispositivo/estado/monto").set(monto);

alert("Compra simulada $" + monto);

});

}


// COMANDOS

function enviarPaso(p){
db.ref("dispositivo/estado/paso").set(p);
}


// LECTURA TIEMPO REAL

db.ref("dispositivo/preciomayor").on("value",snap=>{
document.getElementById("verPreciomayor").innerText = snap.val();
document.getElementById("preciomayor").value = snap.val();
document.getElementById("btnMayor").innerText = snap.val();
});

db.ref("dispositivo/preciomenor").on("value",snap=>{
document.getElementById("verPreciomenor").innerText = snap.val();
document.getElementById("preciomenor").value = snap.val();
document.getElementById("btnMenor").innerText = snap.val();
});

db.ref("dispositivo/preciobidon8").on("value",snap=>{
document.getElementById("verPreciobidon8").innerText = snap.val();
document.getElementById("preciobidon8").value = snap.val();
document.getElementById("btnBidon8").innerText = snap.val();
});

db.ref("dispositivo/estado/qr").on("value",snap=>{
document.getElementById("verQR").innerText = snap.val();
document.getElementById("qr").value = snap.val();
});

db.ref("ubicacion").on("value",snap=>{
document.getElementById("verUbicacion").innerText = snap.val();
document.getElementById("ubicacion").value = snap.val();
});

</script>

</body>
</html>
