<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Llenado</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .screen { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; position: absolute; width: 100%; }
        .active { display: flex; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #debug-bar { position: fixed; top: 0; width: 100%; background: rgba(255,0,0,0.7); font-size: 12px; z-index: 9999; text-align: center; }
        #btn-start { padding: 20px 40px; font-size: 24px; background: #007bff; color: white; border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="debug-bar">Estado: <span id="debug-valor">...</span></div>

    <div id="pantalla-start" class="screen active">
        <button id="btn-start" onclick="iniciarApp()">INICIAR SISTEMA</button>
    </div>

    <div id="pantalla-espera" class="screen">
        <video id="vid-espera" src="espera.mp4" muted loop playsinline></video>
    </div>

    <div id="pantalla-seleccion" class="screen">
        <button onclick="enviarPaso('b6')">Bidón 6 L</button>
        <button onclick="enviarPaso('b12')">Bidón 12 L</button>
        <button onclick="enviarPaso('b20')">Bidón 20 L</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        firebase.initializeApp({ databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com" });
        const refPaso = firebase.database().ref('dispositivo/estado/paso');

        function iniciarApp() {
            document.getElementById('pantalla-start').classList.remove('active');
            mostrarPantalla('pantalla-espera');
        }

        function mostrarPantalla(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const el = document.getElementById(id);
            el.classList.add('active');
            
            const vid = el.querySelector('video');
            if(vid) {
                vid.currentTime = 0;
                vid.play().catch(e => console.log("Error play:", e));
            }
        }

        function enviarPaso(valor) {
            refPaso.set(valor);
        }

        // Lógica de escucha de Firebase
        refPaso.on('value', (snap) => {
            const val = snap.val();
            document.getElementById('debug-valor').innerText = val;
            
            if(val === 'ir') mostrarPantalla('pantalla-espera');
            if(val === 'pago_ok') mostrarPantalla('pantalla-seleccion'); // Ajusta a tu lógica
        });
    </script>
</body>
</html>
