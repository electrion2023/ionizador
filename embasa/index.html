<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        /* Los videos ocupan toda la pantalla */
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
        #video-active { display: block; } /* Solo el video activo se muestra */
    </style>
</head>
<body>

    <video id="v-standby" src="videos/standby.mp4" loop muted playsinline></video>
    <video id="v-intro" src="videos/intro.mp4" playsinline></video>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        firebase.initializeApp({
            databaseURL: "https://pagos-58644-default-rtdb.firebaseio.com"
        });

        const db = firebase.database();
        let currentVideo = null;

        function reproducir(id) {
            // Ocultar todos
            document.querySelectorAll('video').forEach(v => {
                v.style.display = 'none';
                v.pause();
                v.currentTime = 0;
            });

            // Mostrar y reproducir el nuevo
            const v = document.getElementById('v-' + id);
            if(v) {
                v.style.display = 'block';
                v.play().catch(e => console.log("Autoplay bloqueado, toca la pantalla"));
                currentVideo = v;
            }
        }

        // Listener de Firebase
        db.ref('dispositivo/estado/paso').on('value', (snapshot) => {
            const comando = snapshot.val();
            console.log("Comando recibido:", comando);

            if (comando === "ir") {
                reproducir("intro");
            } else if (comando === "" || !comando) {
                reproducir("standby");
            }
        });

        // Iniciar en standby
        reproducir("standby");
    </script>
</body>
</html>
